services:
  # 1. Backend Web Service (Node.js + Express)
  - type: web
    name: cloud-task-manager-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production

  # 2. Frontend Static Site (React SPA)
  - type: web
    name: cloud-task-manager-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_AUTH0_DOMAIN
        sync: false
      - key: REACT_APP_AUTH0_CLIENT_ID
        sync: false
      - key: REACT_APP_DROPBOX_ACCESS_TOKEN
        sync: false
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: cloud-task-manager-backend
          property: host
